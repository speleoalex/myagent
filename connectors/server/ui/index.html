<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyAgent Connectors</title>
  <style>
    :root {
      --bg: #0f1420; --panel: #1a2130; --panel2: #131a27; --border: #2a3446;
      --text: #e6ebf5; --muted: #8b97ad; --accent: #4f8cff; --accent-d: #3b6fd4;
      --ok: #3fb950; --err: #f85149; --warn: #d29922;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f4f8; --panel: #ffffff; --panel2: #f7f9fc; --border: #d8dee9;
        --text: #1a2333; --muted: #5a6678; --accent: #2f6fed; --accent-d: #2559c9;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .logo { width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), #7b5cff); }
    header .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    header .myagent { font-size: 12px; color: var(--muted); }
    header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); margin-right: 5px; vertical-align: middle; }
    header .dot.ok { background: var(--ok); } header .dot.err { background: var(--err); }
    header select#lang { background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font: inherit; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 1fr; gap: 20px; }
    .toolbar { display: flex; align-items: center; gap: 12px; }
    .toolbar h2 { font-size: 15px; margin: 0; }
    .spacer { flex: 1; }
    .card { background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; }
    .list { display: grid; gap: 10px; }
    .binding { display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: border-color .15s; }
    .binding:hover { border-color: var(--accent); }
    .binding .name { font-weight: 600; }
    .binding .sub { color: var(--muted); font-size: 12px; }
    .binding .grow { flex: 1; min-width: 0; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border); white-space: nowrap; }
    .badge .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-right: 5px; background: var(--muted); }
    .badge.running .dot { background: var(--ok); }
    .badge.error .dot { background: var(--err); }
    .badge.starting .dot { background: var(--warn); }
    .badge.disabled { opacity: .6; }
    button { font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
      border: 1px solid var(--border); background: var(--panel2); color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-d); }
    button.danger { color: var(--err); border-color: var(--err); background: transparent; }
    button:disabled { opacity: .5; cursor: default; }
    .empty { color: var(--muted); text-align: center; padding: 40px; }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: none; align-items: flex-start; justify-content: center; padding: 40px 16px;
      overflow: auto; }
    .overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 620px; }
    .modal .head { padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; }
    .modal .head h3 { margin: 0; font-size: 16px; }
    .modal .body { padding: 20px; display: grid; gap: 14px; }
    .modal .foot { padding: 16px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: center; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input, select, textarea { width: 100%; font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px; }
    textarea { resize: vertical; min-height: 56px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .inline { display: flex; gap: 10px; align-items: center; }
    .inline input[type=checkbox] { width: auto; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; z-index: 10; }
    .toast.show { display: block; }
    .toast.ok { border-color: var(--ok); } .toast.err { border-color: var(--err); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1 data-i18n="app.title">MyAgent · Messaging Connectors</h1>
    <div class="right">
      <div class="myagent"><span class="dot" id="ma-dot"></span><span id="ma-url" data-i18n="header.connecting">myagent</span></div>
      <select id="lang" aria-label="language">
        <option value="en">EN</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <h2 data-i18n="list.heading">Connected bots</h2>
      <div class="spacer"></div>
      <button class="primary" id="btn-new" data-i18n="list.new">+ New bot</button>
    </div>
    <div class="list" id="list"></div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="head"><h3 id="modal-title" data-i18n="modal.newTitle">New bot</h3></div>
      <div class="body">
        <div class="row">
          <div>
            <label data-i18n="field.id">ID (unique, immutable)</label>
            <input id="f-id" data-i18n-ph="field.id.ph">
          </div>
          <div>
            <label data-i18n="field.name">Name</label>
            <input id="f-name" data-i18n-ph="field.name.ph">
          </div>
        </div>
        <div class="row">
          <div>
            <label data-i18n="field.type">Channel type</label>
            <select id="f-type"></select>
          </div>
          <div>
            <label data-i18n="field.agent">MyAgent agent</label>
            <select id="f-agent"></select>
          </div>
        </div>
        <div>
          <label data-i18n="field.token">Bot token</label>
          <div class="inline">
            <input id="f-token" data-i18n-ph="field.token.ph" autocomplete="off">
            <button id="btn-test" type="button" data-i18n="btn.test">Test</button>
          </div>
          <div class="field-note" id="test-note" data-i18n="note.token">From @BotFather. Stored encrypted, never shown in clear.</div>
        </div>
        <div class="row">
          <div>
            <label data-i18n="field.access">Access control</label>
            <select id="f-access">
              <option value="allowlist" data-i18n="access.allowlist">Allowlist</option>
              <option value="password" data-i18n="access.password">Password</option>
              <option value="open" data-i18n="access.open">Open to anyone</option>
            </select>
          </div>
          <div>
            <label data-i18n="field.prefix">Session prefix (opt.)</label>
            <input id="f-prefix" data-i18n-ph="field.prefix.ph">
          </div>
        </div>
        <div id="wrap-allowed">
          <label data-i18n="field.allowed">Authorized user ids (comma-separated)</label>
          <input id="f-allowed" data-i18n-ph="field.allowed.ph">
          <div class="field-note" data-i18n="note.allowed">Ask a user to message the bot and read their id in the logs.</div>
        </div>
        <div id="wrap-password" class="hidden">
          <label data-i18n="field.password">Activation password</label>
          <input id="f-password" data-i18n-ph="field.password.ph" autocomplete="off">
        </div>
        <div class="row">
          <div>
            <label data-i18n="field.welcome">Welcome message (opt.)</label>
            <textarea id="f-welcome" data-i18n-ph="field.welcome.ph"></textarea>
          </div>
          <div>
            <label data-i18n="field.help">/help text (opt.)</label>
            <textarea id="f-help"></textarea>
          </div>
        </div>
        <div class="inline">
          <input type="checkbox" id="f-enabled" checked>
          <label for="f-enabled" style="margin:0" data-i18n="field.enabled">Enabled (start polling)</label>
        </div>
      </div>
      <div class="foot">
        <button class="danger" id="btn-delete" data-i18n="btn.delete">Delete</button>
        <div class="spacer" style="flex:1"></div>
        <button id="btn-cancel" data-i18n="btn.cancel">Cancel</button>
        <button class="primary" id="btn-save" data-i18n="btn.save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/it.js"></script>
  <script src="app.js"></script>
</body>
</html>
