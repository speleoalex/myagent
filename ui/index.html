<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: safe-area on notched phones;
         interactive-widget=resizes-content: shrink layout when the virtual
         keyboard opens (Chrome Android), keeping the chat input visible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>MyAgent</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <!-- Installable web app. The manifest uses relative URLs (start_url and
         scope are "."), so installing works just as well when the UI is hosted
         under a subpath. Requires a secure context: localhost qualifies, a
         plain-http LAN address does not — see js/pwa.js. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#212529">
    <!-- iOS reads none of the manifest's colors and needs its own icon. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Both spellings: the unprefixed one is the standard (and the only one
         Chrome accepts without a deprecation warning), the apple- one is still
         what iOS below 16.4 reads to open in standalone mode. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyAgent">
    <!-- Relative asset paths: the UI is static HTML and may be hosted by any
         web server, including under a subpath (e.g. Apache at /myagent/) — a
         leading slash would only resolve at the root of a vhost. -->
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css?v=17" rel="stylesheet">
    <!-- Theme manager: load early to prevent a flash of the wrong theme -->
    <script src="js/theme.js?v=2"></script>
    <!-- PWA: in <head> because beforeinstallprompt fires once and early -->
    <script src="js/pwa.js?v=1"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#/">
                <i class="bi bi-robot"></i> MyAgent
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#/agents"><i class="bi bi-cpu"></i> <span data-i18n="nav.agents">Agents</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/tools"><i class="bi bi-tools"></i> <span data-i18n="nav.tools">Tools</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/models"><i class="bi bi-box"></i> <span data-i18n="nav.models">Models</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/chat"><i class="bi bi-chat-dots"></i> <span data-i18n="nav.chat">Chat</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/tasks"><i class="bi bi-alarm"></i> <span data-i18n="nav.tasks">Tasks</span></a>
                    </li>
                    <!-- Shown only when the connectors plugin is installed:
                         App.pluginsReady() drops the d-none after probing
                         /api/plugins. Hidden by default so a server without the
                         plugin never flashes an entry that leads nowhere. -->
                    <li class="nav-item d-none" data-plugin="connectors">
                        <a class="nav-link" href="#/connectors"><i class="bi bi-send"></i> <span data-i18n="nav.connectors">Connectors</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/settings"><i class="bi bi-gear"></i> <span data-i18n="nav.settings">Settings</span></a>
                    </li>
                </ul>
                <!-- Language and theme controls live in the Settings screen. -->
            </div>
        </div>
    </nav>

    <div id="app" class="container-fluid mt-3"></div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- KaTeX, MathML output only: no stylesheet and no font files, the browser
         draws the <math> it emits. Vendored like everything else (offline). -->
    <script src="vendor/katex/katex.min.js"></script>
    <!-- i18n: core before dictionaries, dictionaries before app scripts -->
    <script src="js/i18n.js?v=2"></script>
    <script src="js/i18n/en.js?v=44"></script>
    <script src="js/i18n/it.js?v=44"></script>
    <script src="js/app.js?v=13"></script>
    <script src="js/rangefield.js?v=2"></script>
    <script src="js/agents.js?v=24"></script>
    <script src="js/tasks.js?v=2"></script>
    <script src="js/tools.js?v=4"></script>
    <script src="js/mcp.js?v=4"></script>
    <script src="js/models.js?v=7"></script>
    <script src="js/chat.js?v=17"></script>
    <script src="js/connectors.js?v=9"></script>
    <script src="js/settings.js?v=8"></script>
</body>
</html>
